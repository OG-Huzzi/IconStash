name: VPS Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Webhook Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Webhook Git Pull
        run: |
          curl -sS --max-time 180 -H "Cache-Control: no-cache" "https://iconstash.io/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}&cb=$(date +%s)" || echo "Webhook dispatched to VPS"
