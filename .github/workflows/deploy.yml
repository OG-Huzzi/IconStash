name: VPS Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Webhook Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Webhook Git Pull
        run: |
          curl -fsS --max-time 240 -H "Cache-Control: no-cache" -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" "https://iconstash.io/deploy.php?cb=$(date +%s)"
